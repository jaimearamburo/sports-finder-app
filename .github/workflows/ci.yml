# Runs on every pull request and every push to main/dev: typecheck, lint, unit
# tests, and the booking database tests against a throwaway Postgres. No
# secrets, no real database.
#
# End-to-end tests run locally (pnpm test:e2e): they need the running app with
# Stripe test keys and a Blob store.
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

# A newer push to the same ref cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # `prisma generate` (postinstall) loads prisma.config.ts, which reads
      # this. Generating never connects, so a placeholder is enough.
      POSTGRES_URL_NON_POOLING: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile fails if package.json and pnpm-lock.yaml disagree.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  # The booking core against a real Postgres: row locks, capacity sums and
  # payment completion. The database is built from the migrations, which proves
  # they apply from scratch.
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_URL_NON_POOLING: postgresql://ci:ci@localhost:5432/ci
      POSTGRES_PRISMA_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm exec prisma migrate deploy

      - name: Database tests
        run: pnpm test:db
